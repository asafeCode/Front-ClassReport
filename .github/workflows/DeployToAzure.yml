name: Deploy Site on Azure Static Web Apps - nice-sand-0964a1b0f

on:
  push:
    branches:
      - develop

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      # Build da aplicação
      - name: Build App
        run: |
          npm ci
          npm run build

      # Deploy para Azure Static Web Apps
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_API_TOKEN_CLASS_REPORT }}
          action: "upload"
          app_location: "/"        # caminho do código-fonte da app
          api_location: ""         # caminho da API (opcional)
          output_location: "dist"  # pasta gerada pelo build
          
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
